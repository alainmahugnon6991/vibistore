<!doctype html>
<html lang="fr">
  <head>
    <title>Créer votre compte.</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="PageCreateCompte.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <section>
      <div class="container">
        <form action="S'inscrire" id="create">
          <h1>Créer un compte</h1>
          <input type="tel" placeholder="Numero Whatsapp" required />
          <input type="password" placeholder="Mot de passe" required />
          <button type="submit">S'inscrire</button>
          <p>
            Vous avez déjà un compte ? <br />
            <br />
            <a href="PageLogin.html"> Se connecter.</a>
          </p>
        </form>
      </div>
    </section>
  </body>
</html>
